<!DOCTYPE html>
<html>
<head>
<title>Orders</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

#customers tr:nth-child(even){background-color: #f2f2f2;}

#customers tr:hover {background-color: #ddd;}

#customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #4CAF50;
  color: white;
}

</style>
</head>
<body>

<table id="customers">
  <tr>
    <th>Data</th>
    <th>Count</th>
    </tr>
  <tr>
    <td>Barista (Lambda):</td>
    <td>{{ApproximateNumberOfMessagesNotVisible}}</td>
  </tr>
  <tr>
    <td>Cashier-Barista Queue:</td>
    <td>{{ApproximateNumberOfMessagesDelayed}}</td>
  </tr>
  <tr>
    <td>Waiter (Coffee Ready) Queue:</td>
    <td>{{ApproximateNumberOfMessages}}</td>
  </tr>
  <tr>
    <td>Coffee Sales (DynamoDB):</td>
    <td>{{dynamoItems}}</td>
  </tr>
</table>

</body>
<script> 
    function timedRefresh(timeoutPeriod) {
      setTimeout("location.reload(true);",timeoutPeriod);
    }    
    window.onload = timedRefresh(1000);   
</script>
</html>
