<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Coffee Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .error-container {
            max-width: 600px;
            margin: 100px auto;
        }
        .error-icon {
            font-size: 5rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="error-container text-center">
        <i class="bi bi-exclamation-triangle-fill error-icon mb-4"></i>
        <h1 class="mb-4">Oops! Something went wrong</h1>
        <div class="alert alert-danger">
            <p>{{ error }}</p>
        </div>
        <a href="https://cicd.aws.yikyakyuk.com/" class="btn btn-primary mt-3">
            <i class="bi bi-house-door me-2"></i>Return to Home
        </a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
