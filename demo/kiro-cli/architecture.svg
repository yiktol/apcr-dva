<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- ============================================================= -->
  <!-- Kiro CLI headless validation gate (CI/CD promotion control)   -->
  <!--                                                               -->
  <!--  Commit -> Pipeline (deploy-to-test) -> gate.sh -> Kiro CLI   -->
  <!--  (headless) reads deploy log via fs_read, emits PASS/FAIL;    -->
  <!--  exit code promotes to prod (PASS) or halts the pipeline      -->
  <!--  (FAIL).                                                      -->
  <!--                                                               -->
  <!--  Icons: official AWS icons (inlined). Fixed lanes/rows keep   -->
  <!--  arrows, text and icons from overlapping.                     -->
  <!-- ============================================================= -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b86"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8e3e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#d93025"/>
    </marker>
  </defs>

  <rect width="1240" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#232f3e">Kiro CLI Headless Validation Gate</text>
  <text x="40" y="74" font-size="14" fill="#5a6b86">A CI/CD stage runs the agent non-interactively; its PASS/FAIL verdict gates promotion to production</text>

  <!-- ===================== CI/CD boundary ===================== -->
  <rect x="230" y="150" width="560" height="300" rx="10"
        fill="none" stroke="#879196" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="248" y="174" font-size="13" font-weight="700" fill="#687078">CI/CD pipeline  -  stage: deploy-to-test</text>

  <!-- ============================================================= -->
  <!-- Node icon top-left corners:                                   -->
  <!--   Commit      x=70    y=272  (48 glyph)                       -->
  <!--   Pipeline    x=270   y=260  (80)                             -->
  <!--   gate.sh     x=470   y=265  (box, not icon)                  -->
  <!--   Kiro CLI    x=610   y=260  (80)                             -->
  <!--   Deploy log  x=680   y=360  (48 glyph, below Kiro CLI)       -->
  <!--   Decision    diamond centered x=880 y=300                    -->
  <!--   Promote     x=1050  y=170  (80)  PASS branch (up)           -->
  <!--   Halt        x=1070  y=440  (box) FAIL branch (down)         -->
  <!-- ============================================================= -->

  <!-- Connectors -->

  <!-- Commit -> Pipeline -->
  <line x1="128" y1="296" x2="268" y2="298" stroke="#5a6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="286" font-size="12" fill="#5a6b86">trigger</text>

  <!-- Pipeline -> gate.sh -->
  <line x1="352" y1="300" x2="468" y2="300" stroke="#5a6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="290" font-size="12" fill="#5a6b86">runs</text>

  <!-- gate.sh -> Kiro CLI -->
  <line x1="572" y1="300" x2="608" y2="300" stroke="#5a6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kiro CLI reads deploy log via fs_read: straight down into the doc -->
  <path d="M650,342 L650,382" fill="none" stroke="#5a6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="378" font-size="12" fill="#5a6b86">fs_read</text>

  <!-- Kiro CLI -> Decision -->
  <line x1="692" y1="300" x2="828" y2="300" stroke="#5a6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="290" font-size="12" fill="#5a6b86">verdict</text>

  <!-- Decision -> Promote (PASS, up): right then up -->
  <path d="M932,284 L1000,284 L1000,210 L1048,210"
        fill="none" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="952" y="200" font-size="12" font-weight="600" fill="#1e8e3e">PASS  (exit 0)</text>

  <!-- Decision -> Halt (FAIL, down): right then down -->
  <path d="M932,316 L1000,316 L1000,470 L1068,470"
        fill="none" stroke="#d93025" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="952" y="498" font-size="12" font-weight="600" fill="#d93025">FAIL  (exit 1)</text>

  <!-- =============================================================== -->
  <!-- ICONS & NODES                                                   -->
  <!-- =============================================================== -->

  <!-- Source commit (Source-Code glyph, 48 scaled to 56) -->
  <g transform="translate(72,272)">
    <svg width="56" height="56" viewBox="0 0 48 48">
      <path d="M25.0518,19.684 L26.9478,20.317 L22.9478,32.317 L21.0518,31.684 L25.0518,19.684 Z M34.6248,25.22 C34.8628,25.409 34.9998,25.697 34.9998,26 C34.9998,26.304 34.8628,26.592 34.6248,26.781 L29.6248,30.781 L28.3748,29.22 L32.3998,26 L28.3748,22.781 L29.6248,21.22 L34.6248,25.22 Z M19.6248,22.781 L15.6008,26 L19.6248,29.22 L18.3748,30.781 L13.3748,26.781 C13.1378,26.592 12.9998,26.304 12.9998,26 C12.9998,25.697 13.1378,25.409 13.3748,25.22 L18.3748,21.22 L19.6248,22.781 Z M9.9998,44 L10.0068,4 L27.9998,4 L27.9998,13 C27.9998,13.552 28.4478,14 28.9998,14 L37.9998,14 L37.9998,44 L9.9998,44 Z M29.9998,5.414 L36.5858,12 L29.9998,12 L29.9998,5.414 Z M39.7068,12.293 L29.7068,2.293 C29.5198,2.105 29.2658,2 28.9998,2 L9.9998,2 C8.8228,2 7.9998,2.822 7.9998,4 L7.9998,44 C7.9998,45.14 8.8598,46 9.9998,46 L37.9998,46 C39.1408,46 39.9998,45.14 39.9998,44 L39.9998,13 C39.9998,12.734 39.8948,12.48 39.7068,12.293 L39.7068,12.293 Z" fill="#232F3D"/>
    </svg>
  </g>
  <text x="100" y="348" font-size="13" font-weight="600" fill="#232f3e" text-anchor="middle">Commit</text>

  <!-- AWS CodePipeline (represents the CI/CD pipeline) -->
  <g transform="translate(270,260)">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <rect x="0" y="0" width="80" height="80" fill="#C925D1"/>
      <path d="M30,31 L35,31 L35,29 L30,29 L30,31 Z M36.667,61.166 L34.817,60.407 L42.409,41.885 L44.259,42.644 L36.667,61.166 Z M45.571,55.78 L51.068,50.958 L45.575,46.197 L46.886,44.685 L53.245,50.198 C53.463,50.387 53.589,50.662 53.590006,50.951 C53.591,51.24 53.467,51.515 53.249,51.706 L46.89,57.284 L45.571,55.78 Z M25.508976,51.048 C25.507,50.759 25.63,50.484 25.847,50.293 L32.184,44.691 L33.508,46.19 L28.029,51.033 L33.478,55.73 L32.171,57.245 L25.855,51.799 C25.637,51.611 25.511,51.337 25.508976,51.048 L25.508976,51.048 Z M62.535,35 L18.465,35 C16.555,35 15,33.446 15,31.536 L15,31 L27,31 L27,29 L15,29 L15,18.464 C15,16.554 16.555,15 18.465,15 L62.535,15 C64.445,15 66,16.554 66,18.464 L66,29 L38,29 L38,31 L66,31 L66,31.536 C66,33.446 64.445,35 62.535,35 L62.535,35 Z M22,66 L58,66 L58,37 L22,37 L22,66 Z M62.535,13 L18.465,13 C15.451,13 13,15.451 13,18.464 L13,31.536 C13,34.549 15.451,37 18.465,37 L20,37 L20,67 C20,67.552 20.447,68 21,68 L59,68 C59.553,68 60,67.552 60,67 L60,37 L62.535,37 C65.549,37 68,34.549 68,31.536 L68,18.464 C68,15.451 65.549,13 62.535,13 L62.535,13 Z" fill="#FFFFFF"/>
    </svg>
  </g>
  <text x="310" y="356" font-size="13" font-weight="600" fill="#232f3e" text-anchor="middle">CI/CD Pipeline</text>

  <!-- gate.sh (script box) -->
  <rect x="470" y="272" width="102" height="56" rx="8" fill="#f1f3f8" stroke="#5a6b86" stroke-width="1.5"/>
  <text x="521" y="297" font-size="13" font-weight="700" fill="#232f3e" text-anchor="middle">gate.sh</text>
  <text x="521" y="314" font-size="10" fill="#5a6b86" text-anchor="middle">wrapper + exit code</text>

  <!-- AWS CLI icon (represents Kiro CLI headless) -->
  <g transform="translate(610,260)">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <rect x="0" y="0" width="80" height="80" fill="#C925D1"/>
      <path d="M12,13 L12,67 L46,67 L46,65 L14,65 L14,23 L66,23 L66,65 L59,65 L59,67 L68,67 L68,13 L12,13 Z M14,21 L66,21 L66,15 L14,15 L14,21 Z M25,19 L27.001,19 L27.001,16.999 L25,16.999 L25,19 Z M21,19 L23,19 L23,16.999 L21,16.999 L21,19 Z M17,19 L19,19 L19,16.999 L17,16.999 L17,19 Z M23.326,33.432 L33.406,43.514 L23.326,53.594 L24.74,55.008 L36.234,43.514 L24.74,32.018 L23.326,33.432 Z M38,51 L55,51 L55,49 L38,49 L38,51 Z" fill="#FFFFFF"/>
    </svg>
  </g>
  <text x="650" y="356" font-size="13" font-weight="600" fill="#232f3e" text-anchor="middle">Kiro CLI (headless)</text>

  <!-- Deploy log (Document glyph) -->
  <g transform="translate(628,384)">
    <svg width="44" height="44" viewBox="0 0 48 48">
      <path d="M15,20 L28,20 L28,18 L15,18 L15,20 Z M15,34 L28,34 L28,32 L15,32 L15,34 Z M15,27 L32,27 L32,25 L15,25 L15,27 Z M10,44 L10.007,4 L28,4 L28,13 C28,13.552 28.447,14 29,14 L38,14 L38.025,44 L10,44 Z M30,5.414 L36.586,12 L30,12 L30,5.414 Z M39.707,12.293 L29.707,2.293 C29.52,2.105 29.266,2 29,2 L10,2 C8.822,2 8,2.822 8,4 L8,44 C8,45.14 8.859,46 10,46 L38.025,46 C39.151,46 40,45.14 40,44 L40,13 C40,12.735 39.895,12.48 39.707,12.293 L39.707,12.293 Z" fill="#232F3D"/>
    </svg>
  </g>
  <text x="650" y="446" font-size="12" font-weight="600" fill="#232f3e" text-anchor="middle">deploy log</text>
  <text x="650" y="461" font-size="10" fill="#5a6b86" text-anchor="middle">7 validation checks</text>

  <!-- Decision diamond (PASS/FAIL verdict) -->
  <polygon points="880,258 932,300 880,342 828,300"
           fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="880" y="296" font-size="12" font-weight="700" fill="#8a6d00" text-anchor="middle">verdict?</text>
  <text x="880" y="311" font-size="9" fill="#8a6d00" text-anchor="middle">PASS / FAIL</text>

  <!-- AWS CodeDeploy (promote to production) -->
  <g transform="translate(1050,170)">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <rect x="0" y="0" width="80" height="80" fill="#C925D1"/>
