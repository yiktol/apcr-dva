    </svg>
  </g>
  <text x="1090" y="266" font-size="13" font-weight="600" fill="#232f3e" text-anchor="middle">Promote to production</text>
  <text x="1090" y="282" font-size="11" fill="#1e8e3e" text-anchor="middle">deploy continues</text>

  <!-- Halt (stop node) -->
  <rect x="1070" y="442" width="110" height="56" rx="8" fill="#fdecea" stroke="#d93025" stroke-width="1.5"/>
  <text x="1125" y="467" font-size="13" font-weight="700" fill="#b3261e" text-anchor="middle">Halt pipeline</text>
  <text x="1125" y="484" font-size="10" fill="#b3261e" text-anchor="middle">no promotion</text>

  <!-- Footer note -->
  <text x="40" y="610" font-size="11" fill="#8a97ab">The CLI exits 0 whenever the run succeeds, so gate.sh asks the agent for a PASS/FAIL sentinel and maps it to the exit code that drives the pipeline.</text>
</svg>
