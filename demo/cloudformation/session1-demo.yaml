AWSTemplateFormatVersion: '2010-09-09'
Description: >
  APCR-DVA Session 1 Demo - Serverless Microservice with Private Networking.
  Demonstrates VPC, Security Groups, NACLs, VPC Endpoints, Lambda, DynamoDB,
  API Gateway, CloudFront, IAM Roles, and condition-based policies.

Parameters:
  ProjectName:
    Type: String
    Default: apcr-dva-session1
    Description: Prefix for resource naming
  DomainName:
    Type: String
    Default: aws.yikyakyuk.com
    Description: Base domain name for the hosted zone
  HostedZoneId:
    Type: String
    Default: Z09170582IZGKC67IAX17
    Description: Route 53 Hosted Zone ID
  RegionalCertificateId:
    Type: String
    Default: 8186a3c2-b2cb-4c40-9210-86f79070d7ba
    Description: ACM certificate ID in ap-southeast-1 (for API Gateway)
  CloudFrontCertificateId:
    Type: String
    Default: 417df345-28ea-4c39-8e5d-d985abb59908
    Description: ACM certificate ID in us-east-1 (for CloudFront)

Resources:
  # ============================================================
  # VPC & NETWORKING
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Public Subnets (2 AZs) ---

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b

  # --- Private Subnets (2 AZs) ---

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b

  # --- Route Tables ---

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-rt

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --- Network ACLs (demonstrating stateless subnet-level filtering) ---

  PrivateSubnetNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-nacl

  # Allow all outbound from private subnets (for VPC endpoint traffic)
  PrivateNACLOutboundRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  # Allow all inbound within VPC CIDR
  PrivateNACLInboundVPC:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.0.0/16

  # Allow inbound return traffic on ephemeral ports (required for VPC Gateway Endpoints)
  # NACLs are stateless - response traffic from DynamoDB VPC endpoint needs explicit allow
  PrivateNACLInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  # Deny all other inbound (explicit deny for demo purposes)
  PrivateNACLInboundDenyAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 200
      Protocol: -1
      RuleAction: deny
      Egress: false
      CidrBlock: 0.0.0.0/0

  PrivateSubnetANACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      NetworkAclId: !Ref PrivateSubnetNACL

  PrivateSubnetBNACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      NetworkAclId: !Ref PrivateSubnetNACL

  # ============================================================
  # SECURITY GROUPS (Three-Tier Demo)
  # ============================================================

  # Presentation Tier SG (API Gateway doesn't use SGs, but included for concept demo)
  PresentationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Presentation tier - allows HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-presentation-sg

  # Logic Tier SG (Lambda)
  LogicTierSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Logic tier - allows HTTPS from presentation tier
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref PresentationSG
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-logic-sg

  # Data Tier SG (DynamoDB VPC Endpoint uses this)
  DataTierSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Data tier - allows traffic from logic tier
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LogicTierSG
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data-sg

  # Lambda Security Group (actual SG attached to Lambda ENI)
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda function in VPC
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-lambda-sg

  # ============================================================
  # VPC ENDPOINTS (Private connectivity - no public internet)
  # ============================================================

  DynamoDBVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:*
            Resource: '*'

  # ============================================================
  # DYNAMODB TABLE
  # ============================================================

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-inventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-inventory
        - Key: Project
          Value: APCR-DVA-Demo

  # ============================================================
  # IAM ROLES & POLICIES
  # ============================================================

  # Lambda Execution Role (least privilege)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt InventoryTable.Arn
                  - !Sub ${InventoryTable.Arn}/index/*

  # Auditor Role (demonstrates STS AssumeRole - read-only)
  AuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-auditor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
      Policies:
        - PolicyName: ReadOnlyInventory
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt InventoryTable.Arn

  # Condition-based policy demo (matches slide 54 concept)
  ConditionBasedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-condition-demo-policy
      Description: Demo policy showing date and VPC conditions. Allows DynamoDB GetItem only within a date range AND from a specific VPC.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt InventoryTable.Arn
            Condition:
              DateGreaterThan:
                aws:CurrentTime: '2025-01-01T00:00:00Z'
              DateLessThan:
                aws:CurrentTime: '2026-12-31T23:59:59Z'
              StringEquals:
                aws:SourceVpc: !Ref VPC

  # ============================================================
  # LAMBDA FUNCTION
  # ============================================================

  InventoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-inventory-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          TABLE_NAME: !Ref InventoryTable
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from botocore.exceptions import ClientError

          dynamodb = boto3.resource('dynamodb', region_name=os.environ['REGION'])
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def handler(event, context):
              """Inventory API Lambda handler."""
              http_method = event.get('httpMethod', 'GET')
              path = event.get('path', '/')

              try:
                  if http_method == 'GET' and path == '/inventory':
                      # List all items
                      response = table.scan()
                      items = response.get('Items', [])
                      return api_response(200, {'items': items, 'count': len(items)})

                  elif http_method == 'GET' and path.startswith('/inventory/'):
                      # Get single item
                      item_id = path.split('/')[-1]
                      response = table.get_item(Key={'itemId': item_id})
                      item = response.get('Item')
                      if item:
                          return api_response(200, item)
                      return api_response(404, {'error': 'Item not found'})

                  elif http_method == 'POST' and path == '/inventory':
                      # Create item
                      body = json.loads(event.get('body', '{}'))
                      if 'itemId' not in body:
                          return api_response(400, {'error': 'itemId is required'})
                      table.put_item(Item=body)
                      return api_response(201, {'message': 'Item created', 'item': body})

                  elif http_method == 'GET' and path == '/health':
                      return api_response(200, {
                          'status': 'healthy',
                          'service': 'inventory-api',
                          'vpc_endpoint': 'DynamoDB accessed via VPC Endpoint (no internet)'
                      })

                  else:
                      return api_response(404, {'error': 'Not found'})

              except ClientError as e:
                  return api_response(500, {'error': str(e)})

          def api_response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*'
                  },
                  'body': json.dumps(body, default=str)
              }

  # ============================================================
  # API GATEWAY (REST API)
  # ============================================================

  InventoryApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${ProjectName}-api
      Description: Inventory Microservice API (APCR-DVA Session 1 Demo)
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /health resource
  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InventoryApi
      ParentId: !GetAtt InventoryApi.RootResourceId
      PathPart: health

  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InventoryApi
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InventoryFunction.Arn}/invocations

  # /inventory resource
  InventoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InventoryApi
      ParentId: !GetAtt InventoryApi.RootResourceId
      PathPart: inventory

  InventoryGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InventoryApi
      ResourceId: !Ref InventoryResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InventoryFunction.Arn}/invocations

  InventoryPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InventoryApi
      ResourceId: !Ref InventoryResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InventoryFunction.Arn}/invocations

  # /inventory/{itemId} resource
  InventoryItemResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref InventoryApi
      ParentId: !Ref InventoryResource
      PathPart: '{itemId}'

  InventoryItemGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref InventoryApi
      ResourceId: !Ref InventoryItemResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InventoryFunction.Arn}/invocations

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - HealthGetMethod
      - InventoryGetMethod
      - InventoryPostMethod
      - InventoryItemGetMethod
    Properties:
      RestApiId: !Ref InventoryApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref InventoryApi
      DeploymentId: !Ref ApiDeployment
      StageName: demo
      Description: Demo stage for APCR-DVA Session 1

  # Lambda permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InventoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${InventoryApi}/*

  # ============================================================
  # API GATEWAY CUSTOM DOMAIN
  # ============================================================

  ApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Sub apcr-dva-api.${DomainName}
      RegionalCertificateArn: !Sub arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/${RegionalCertificateId}
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ApiStage
    Properties:
      DomainName: !Ref ApiCustomDomain
      RestApiId: !Ref InventoryApi
      Stage: demo

  # ============================================================
  # CLOUDFRONT DISTRIBUTION
  # ============================================================

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${ProjectName} - CDN in front of API Gateway
        Aliases:
          - !Sub apcr-dva-cdn.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Sub arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${CloudFrontCertificateId}
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Sub ${InventoryApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: /demo
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        PriceClass: PriceClass_100
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-cdn

  # ============================================================
  # ROUTE 53 DNS RECORDS
  # ============================================================

  # Alias record for API Gateway custom domain
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub apcr-dva-api.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

  # Alias record for CloudFront distribution
  CdnDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub apcr-dva-cdn.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (global constant)

  # ============================================================
  # SEED DATA (Custom Resource to populate DynamoDB)
  # ============================================================

  SeedDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-seed-data
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref InventoryTable
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import cfnresponse

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  dynamodb = boto3.resource('dynamodb', region_name=os.environ['REGION'])
                  table = dynamodb.Table(os.environ['TABLE_NAME'])

                  items = [
                      {'itemId': 'ITEM-001', 'name': 'Wireless Mouse', 'category': 'Electronics', 'quantity': 150, 'warehouse': 'us-east-1'},
                      {'itemId': 'ITEM-002', 'name': 'USB-C Cable', 'category': 'Accessories', 'quantity': 500, 'warehouse': 'us-east-1'},
                      {'itemId': 'ITEM-003', 'name': 'Mechanical Keyboard', 'category': 'Electronics', 'quantity': 75, 'warehouse': 'eu-west-1'},
                      {'itemId': 'ITEM-004', 'name': 'Monitor Stand', 'category': 'Furniture', 'quantity': 30, 'warehouse': 'ap-southeast-2'},
                      {'itemId': 'ITEM-005', 'name': 'Webcam HD', 'category': 'Electronics', 'quantity': 200, 'warehouse': 'us-west-2'},
                  ]

                  with table.batch_writer() as batch:
                      for item in items:
                          batch.put_item(Item=item)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'ItemCount': str(len(items))})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  SeedData:
    Type: Custom::SeedData
    DependsOn: InventoryTable
    Properties:
      ServiceToken: !GetAtt SeedDataFunction.Arn

# ============================================================
# OUTPUTS
# ============================================================

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://apcr-dva-api.${DomainName}

  CloudFrontUrl:
    Description: CloudFront distribution URL (CDN in front of API)
    Value: !Sub https://apcr-dva-cdn.${DomainName}

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref InventoryTable

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref InventoryFunction

  AuditorRoleArn:
    Description: Auditor role ARN (for STS AssumeRole demo)
    Value: !GetAtt AuditorRole.Arn

  VPCEndpointId:
    Description: DynamoDB VPC Endpoint ID
    Value: !Ref DynamoDBVPCEndpoint

  ConditionPolicyArn:
    Description: Condition-based IAM policy ARN (for policy interpretation demo)
    Value: !Ref ConditionBasedPolicy

  TestCommands:
    Description: Quick test commands after deployment
    Value: !Sub |
      # Health check via API Gateway custom domain:
      curl https://apcr-dva-api.${DomainName}/health

      # List inventory:
      curl https://apcr-dva-api.${DomainName}/inventory

      # Get single item:
      curl https://apcr-dva-api.${DomainName}/inventory/ITEM-001

      # Health check via CloudFront custom domain:
      curl https://apcr-dva-cdn.${DomainName}/health

      # Assume auditor role:
      aws sts assume-role --role-arn ${AuditorRole.Arn} --role-session-name demo-auditor
