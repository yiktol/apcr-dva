<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a6d4f"/>
    </marker>
    <style>
      .box { fill: #fdf7ef; stroke: #c98a3c; stroke-width: 2; rx: 10; }
      .runtime { fill: #f3f8ef; stroke: #7fb069; stroke-width: 2; }
      .data { fill: #fbf1e6; stroke: #e0a458; stroke-width: 2; }
      .title { font-size: 22px; font-weight: 700; fill: #3a2a1d; }
      .label { font-size: 14px; font-weight: 600; fill: #3a2a1d; }
      .sub { font-size: 11px; fill: #8a6d4f; }
      .section { font-size: 13px; font-weight: 700; fill: #8a6d4f; letter-spacing: .06em; }
      .flow { stroke: #8a6d4f; stroke-width: 2; fill: none; }
      .note { font-size: 11px; fill: #b4461f; font-weight: 600; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="46" class="title">☕ Coffee Ship — build &amp; ship to Fargate</text>

  <!-- Pipeline row -->
  <text x="40" y="86" class="section">CI / CD PIPELINE</text>

  <g>
    <rect x="40" y="100" width="150" height="64" rx="10" class="box"/>
    <text x="115" y="128" text-anchor="middle" class="label">source.zip</text>
    <text x="115" y="148" text-anchor="middle" class="sub">S3 source bucket</text>
  </g>
  <g>
    <rect x="230" y="100" width="150" height="64" rx="10" class="box"/>
    <text x="305" y="128" text-anchor="middle" class="label">CodePipeline</text>
    <text x="305" y="148" text-anchor="middle" class="sub">orchestrates stages</text>
  </g>
  <g>
    <rect x="420" y="100" width="150" height="64" rx="10" class="box"/>
    <text x="495" y="128" text-anchor="middle" class="label">CodeBuild</text>
    <text x="495" y="148" text-anchor="middle" class="sub">docker build</text>
  </g>
  <g>
    <rect x="610" y="100" width="150" height="64" rx="10" class="box"/>
    <text x="685" y="128" text-anchor="middle" class="label">ECR</text>
    <text x="685" y="148" text-anchor="middle" class="sub">image registry</text>
  </g>

  <line x1="190" y1="132" x2="230" y2="132" class="flow" marker-end="url(#arrow)"/>
  <line x1="380" y1="132" x2="420" y2="132" class="flow" marker-end="url(#arrow)"/>
  <line x1="570" y1="132" x2="610" y2="132" class="flow" marker-end="url(#arrow)"/>

  <!-- Runtime row -->
  <text x="40" y="236" class="section">RUNTIME</text>

  <g>
    <rect x="40" y="250" width="170" height="70" rx="10" class="runtime"/>
    <text x="125" y="280" text-anchor="middle" class="label">ECS / Fargate</text>
    <text x="125" y="300" text-anchor="middle" class="sub">container task (web)</text>
  </g>
  <g>
    <rect x="260" y="250" width="150" height="70" rx="10" class="runtime"/>
    <text x="335" y="280" text-anchor="middle" class="label">ALB</text>
    <text x="335" y="300" text-anchor="middle" class="sub">internal routing</text>
  </g>
  <g>
    <rect x="460" y="250" width="170" height="70" rx="10" class="runtime"/>
    <text x="545" y="280" text-anchor="middle" class="label">CloudFront</text>
    <text x="545" y="300" text-anchor="middle" class="sub">public edge</text>
  </g>
  <g>
    <rect x="680" y="250" width="150" height="70" rx="10" fill="#fdf7ef" stroke="#8a6d4f" stroke-width="2"/>
    <text x="755" y="288" text-anchor="middle" class="label">Users</text>
  </g>

  <!-- ECR deploys image into Fargate -->
  <path d="M685 164 L685 200 L125 200 L125 250" class="flow" marker-end="url(#arrow)"/>
  <text x="400" y="193" text-anchor="middle" class="sub">rolling deploy (EcsDeployAction)</text>

  <line x1="210" y1="285" x2="260" y2="285" class="flow" marker-end="url(#arrow)"/>
  <line x1="410" y1="285" x2="460" y2="285" class="flow" marker-end="url(#arrow)"/>
  <line x1="630" y1="285" x2="680" y2="285" class="flow" marker-end="url(#arrow)"/>

  <text x="545" y="340" text-anchor="middle" class="note">ALB security group allows the CloudFront prefix list only</text>

  <!-- Supporting services -->
  <text x="40" y="408" class="section">SUPPORTING SERVICES</text>

  <g>
    <rect x="40" y="422" width="160" height="60" rx="10" class="data"/>
    <text x="120" y="450" text-anchor="middle" class="label">DynamoDB</text>
    <text x="120" y="469" text-anchor="middle" class="sub">orders + loyalty</text>
  </g>
  <g>
    <rect x="220" y="422" width="160" height="60" rx="10" class="data"/>
    <text x="300" y="450" text-anchor="middle" class="label">SQS</text>
    <text x="300" y="469" text-anchor="middle" class="sub">order buffer</text>
  </g>
  <g>
    <rect x="400" y="422" width="160" height="60" rx="10" class="data"/>
    <text x="480" y="450" text-anchor="middle" class="label">AppConfig</text>
    <text x="480" y="469" text-anchor="middle" class="sub">runtime config</text>
  </g>
  <g>
    <rect x="580" y="422" width="160" height="60" rx="10" class="data"/>
    <text x="660" y="450" text-anchor="middle" class="label">SSM Parameters</text>
    <text x="660" y="469" text-anchor="middle" class="sub">app parameters</text>
  </g>
  <g>
    <rect x="760" y="422" width="180" height="60" rx="10" class="data"/>
    <text x="850" y="450" text-anchor="middle" class="label">Secrets Manager</text>
    <text x="850" y="469" text-anchor="middle" class="sub">application secrets</text>
  </g>

  <!-- Fargate uses supporting services -->
  <path d="M125 320 L125 422" class="flow" marker-end="url(#arrow)"/>
  <text x="40" y="516" class="sub">The Fargate task reads/writes DynamoDB, SQS, AppConfig, SSM and Secrets Manager at runtime.</text>
</svg>
