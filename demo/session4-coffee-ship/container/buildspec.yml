version: 0.2

# Real container build for the coffee-shop ECS/Fargate service.
#
# Runs in a CodeBuild project with privileged:true so Docker is available.
# Builds container/ via container/Dockerfile, tags BOTH :latest and a unique
# per-build tag, pushes BOTH to the coffee-shop ECR repo, runs real checks, and
# emits imagedefinitions.json (containerName "web") for the ECS deploy actions.
#
# The source.zip fed to the pipeline must contain the container/ directory
# (app.py, Dockerfile, requirements.txt), the React SPA source at
# container/frontend/ (package.json, vite.config.js, index.html, src/) and the
# diagram at container/architecture.svg, plus this buildspec at
# container/buildspec.yml. The multi-stage Dockerfile runs `npm ci && npm run
# build` INSIDE the docker build (CodeBuild is privileged), so no npm step is
# needed here; a developer's local frontend/node_modules and frontend/dist are
# excluded from source.zip (see deploy.sh) and rebuilt fresh in the image.

phases:
  pre_build:
    commands:
      - echo "Resolving account/region and logging in to ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - 'REPO_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/coffee-shop'
      # Unique, immutable tag per build (commit sha when available, else build number).
      - 'IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}'
      - echo "Repo URI = $REPO_URI  Image tag = $IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  build:
    commands:
      # Real check: the app must compile. No "|| true" — a nonzero exit fails the build.
      - echo "Compiling container app (py_compile)..."
      - python -m py_compile container/app.py
      - echo "Building Docker image..."
      - docker build -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" container/
  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push "$REPO_URI:$IMAGE_TAG"
      - docker push "$REPO_URI:latest"
      # imagedefinitions.json: containerName MUST match the ECS container name
      # ("web", the ApplicationLoadBalancedFargateService default). imageUri uses
      # the unique tag so the rolling ECS deploy (Test) registers a distinct task
      # definition.
      - echo "Writing imagedefinitions.json (rolling Test deploy)..."
      - printf '[{"name":"web","imageUri":"%s"}]' "$REPO_URI:$IMAGE_TAG" > imagedefinitions.json
      # imageDetail.json: {ImageURI} shape consumed by the prod CodeDeploy ECS
      # blue/green action to fill the taskdef.json <IMAGE1_NAME> placeholder.
      # NOTE: the name MUST be imageDetail.json (SINGULAR) — the CodeDeployToECS
      # blue/green action hard-requires that exact filename (not imageDetails).
      - echo "Writing imageDetail.json (prod CodeDeploy blue/green)..."
      - printf '{"ImageURI":"%s"}' "$REPO_URI:$IMAGE_TAG" > imageDetail.json
      # Fail loudly if the prod substitution inputs are missing — no silent gaps.
      - echo "Checking required prod task-definition env vars..."
      - test -n "$PROD_EXECUTION_ROLE_ARN" && test -n "$PROD_TASK_ROLE_ARN" && test -n "$ORDERS_QUEUE_URL"
      # Render the prod CodeDeploy task definition template into the artifact root.
      # Substitute the role ARNs and queue URL; leave <IMAGE1_NAME> for CodeDeploy.
      # '#' sed delimiter avoids clashing with '/' in ARNs/URLs.
      - echo "Rendering taskdef.json (prod CodeDeploy template)..."
      - |
        sed -e "s#<EXECUTION_ROLE_ARN>#${PROD_EXECUTION_ROLE_ARN}#g" \
            -e "s#<TASK_ROLE_ARN>#${PROD_TASK_ROLE_ARN}#g" \
            -e "s#<ORDERS_QUEUE_URL>#${ORDERS_QUEUE_URL}#g" \
            container/taskdef.json > taskdef.json
      # appspec.yaml: the ECS blue/green appspec consumed by the prod CodeDeploy action.
      - echo "Copying appspec.yaml (prod CodeDeploy blue/green)..."
      - cp container/appspec.yaml appspec.yaml
      - cat imagedefinitions.json imageDetail.json taskdef.json appspec.yaml

artifacts:
  files:
    - imagedefinitions.json
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
