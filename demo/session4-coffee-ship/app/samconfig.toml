# SAM CLI configuration for the coffee-shop serverless app.
# Region is pinned to ap-southeast-1 to match the CDK infra and deploy scripts.
version = 0.1

[default.deploy.parameters]
stack_name = "coffee-shop-app"
region = "ap-southeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true

[default.validate.parameters]
lint = true

[default.build.parameters]
cached = true
