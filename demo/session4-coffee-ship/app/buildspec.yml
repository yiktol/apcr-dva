version: 0.2

# CodeBuild buildspec for the coffee-shop serverless app.
# Referenced by the CDK pipeline as 'app/buildspec.yml'.
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing test dependencies"
      - python -m pip install --upgrade pip
      - python -m pip install -r dev-requirements.txt
  build:
    commands:
      # Validate the SAM template. SAM CLI may be absent in some environments,
      # so guard it: a missing CLI is a skipped (non-fatal) check, but a present
      # CLI that reports a real error WILL fail the stage.
      - |
        if command -v sam >/dev/null 2>&1; then
          echo "Running sam validate --lint"
          sam validate --lint
        else
          echo "SAM CLI not found; skipping sam validate (non-fatal)"
        fi
      - echo "Running unit tests"
      - python -m pytest -q
      # Headless validation gate. This is a DOCUMENTED NO-OP PLACEHOLDER that
      # exits 0 by default so it never blocks the pipeline. In a real
      # deployment this would invoke an automated review of the deploy log; a
      # NON-ZERO exit here FAILS the build stage and stops the deployment.
      - |
        echo "Headless validation gate (placeholder)"
        kiro --headless --prompt "review the deploy log" || true
        # The '|| true' keeps the placeholder non-blocking because the 'kiro'
        # binary is not present in this environment. Remove the '|| true'
        # to make a non-zero exit fail the stage in a real pipeline.
        exit 0

artifacts:
  files:
    - template.yaml
    - samconfig.toml
    - appspec.yaml
    - src/**/*
